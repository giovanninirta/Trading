name: Bot trend (simulato)

on:
  schedule:
    - cron: "20 0 * * *"      # ogni giorno alle 00:20 UTC, dopo la chiusura della candela giornaliera
  workflow_dispatch:
  push:                        # riparte anche quando il bot viene aggiornato
    branches: [main]
    paths: ["bot/rev*/*.py", ".github/workflows/bot.yml"]

permissions:
  contents: write

concurrency:
  group: scrittura-repository
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot Rev 2 (senza filtro)
        working-directory: bot/rev2
        run: python bot_trend_rev2.py
      - name: Bot Rev 3 (con filtro forza contro BTC)
        if: always()
        working-directory: bot/rev3
        run: python bot_trend_rev3.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "bot-trend"
          git config user.email "bot-trend@users.noreply.github.com"
          git add bot
          git diff --cached --quiet && exit 0
          git commit -m "Bot: aggiornamento del $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
