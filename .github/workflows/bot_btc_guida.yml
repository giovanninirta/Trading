name: Bot BTC guida (simulato)

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # ogni 15 minuti
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/rev6/*.py", "bot/rev7/*.py", "bot/rev8/*.py", "bot/rev9/*.py", "bot/rev10/*.py", "bot/rev11/*.py", ".github/workflows/bot_btc_guida.yml"]

permissions:
  contents: write

concurrency:
  group: scrittura-repository
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cecchino (Rev 6, versione A, BTC oltre 2 ATR)
        working-directory: bot/rev6
        run: python bot_btc_guida_rev6.py
      - name: Segugio (Rev 7, versione B, BTC oltre +1,25 %)
        if: always()
        working-directory: bot/rev7
        run: python bot_btc_guida_rev7.py
      - name: Cecchino 29 (Rev 8, versione C, regola Cecchino su 29 monete)
        if: always()
        working-directory: bot/rev8
        run: python bot_btc_guida_rev8.py
      - name: Segugio Short (Rev 9, short dopo i crolli di BTC)
        if: always()
        working-directory: bot/rev9
        run: python bot_btc_guida_rev9.py
      - name: Cecchino + Short (Rev 10, long e short nello stesso conto)
        if: always()
        working-directory: bot/rev10
        run: python bot_btc_guida_rev10.py
      - name: Cecchino 29 Stop (Rev 11, Cecchino 29 con ordine stop d'ingresso)
        if: always()
        working-directory: bot/rev11
        run: python bot_btc_guida_rev11.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "bot-btc-guida"
          git config user.email "bot-btc-guida@users.noreply.github.com"
          git add bot/rev6 bot/rev7 bot/rev8 bot/rev9 bot/rev10 bot/rev11
          git diff --cached --quiet && exit 0
          git commit -m "Bot BTC guida: aggiornamento $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase
          git push
